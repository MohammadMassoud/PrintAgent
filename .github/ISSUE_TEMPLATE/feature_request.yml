name: Feature request / Sugerir melhoria
description: Explain a use case and the behavior you need.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Keep the proposal focused on printing transport and integration. Include relevant SDK, agent and printer constraints.
    validations:
      required: true
